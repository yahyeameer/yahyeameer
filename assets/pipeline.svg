<svg xmlns="http://www.w3.org/2000/svg" width="854" height="200" viewBox="0 0 854 200">
<style>@keyframes pu{0%,100%{opacity:.55}10%,20%{opacity:1}}.p0{animation:pu 5s ease-in-out 0s infinite}.p1{animation:pu 5s ease-in-out 1s infinite}.p2{animation:pu 5s ease-in-out 2s infinite}.p3{animation:pu 5s ease-in-out 3s infinite}.p4{animation:pu 5s ease-in-out 4s infinite}
.d{animation:mv 5s linear infinite}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(664px)}}
.lbl{font:600 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9fe9f5}</style>
<rect width="854" height="200" rx="16" fill="#0d1117"/>
<line x1="94" y1="95" x2="760" y2="95" stroke="#2a3355" stroke-width="3" stroke-dasharray="6 6"/>
<g class="p0"><rect x="20" y="40" width="148" height="110" rx="14" fill="#161b33" stroke="#8a2be2" stroke-width="2"/>
<text x="94" y="80" text-anchor="middle" style="font:28px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">🧑‍💼</text>
<text x="94" y="112" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff">Request</text>
<text x="94" y="133" text-anchor="middle" style="font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9fb3c8">user asks agent</text></g><g class="p1"><rect x="186" y="40" width="148" height="110" rx="14" fill="#161b33" stroke="#ff6b6b" stroke-width="2"/>
<text x="260" y="80" text-anchor="middle" style="font:28px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">🔒</text>
<text x="260" y="112" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff">Policy hook</text>
<text x="260" y="133" text-anchor="middle" style="font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9fb3c8">fail-closed check</text></g><g class="p2"><rect x="352" y="40" width="148" height="110" rx="14" fill="#161b33" stroke="#f7b731" stroke-width="2"/>
<text x="426" y="80" text-anchor="middle" style="font:28px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">✅</text>
<text x="426" y="112" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff">Human approval</text>
<text x="426" y="133" text-anchor="middle" style="font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9fb3c8">sensitive actions</text></g><g class="p3"><rect x="518" y="40" width="148" height="110" rx="14" fill="#161b33" stroke="#24c6dc" stroke-width="2"/>
<text x="592" y="80" text-anchor="middle" style="font:28px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">🔌</text>
<text x="592" y="112" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff">MCP tool call</text>
<text x="592" y="133" text-anchor="middle" style="font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9fb3c8">runs in sandbox</text></g><g class="p4"><rect x="684" y="40" width="148" height="110" rx="14" fill="#161b33" stroke="#2ea44f" stroke-width="2"/>
<text x="758" y="80" text-anchor="middle" style="font:28px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">📜</text>
<text x="758" y="112" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff">Audit log</text>
<text x="758" y="133" text-anchor="middle" style="font:500 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9fb3c8">write-ahead trail</text></g>
<circle class="d" cx="94" cy="170" r="7" fill="#24c6dc"><animate attributeName="fill" values="#8a2be2;#ff6b6b;#f7b731;#24c6dc;#2ea44f" dur="5s" repeatCount="indefinite"/></circle>
<text x="427" y="26" text-anchor="middle" class="lbl">Every agent action flows through this path — a denied action never reaches the tool</text>
</svg>