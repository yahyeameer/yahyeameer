<svg xmlns="http://www.w3.org/2000/svg" width="854" height="250" viewBox="0 0 854 250">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0c29"/><stop offset="0.5" stop-color="#302b63"/><stop offset="1" stop-color="#24c6dc"/></linearGradient>
