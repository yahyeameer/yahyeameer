<style>
.t{font:800 56px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;opacity:0;animation:f 1.1s ease-out forwards}
.sub{font:600 18px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#d6f6fb;opacity:0;animation:f 1.1s ease-out .45s forwards}
.tag{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9fe9f5;opacity:0;animation:f 1.1s ease-out .9s forwards}
.s0{animation:tw 2.2s ease-in-out infinite}.s1{animation:tw 3.1s ease-in-out .7s infinite}.s2{animation:tw 2.7s ease-in-out 1.3s infinite}
.a{animation:fl 7s ease-in-out infinite alternate}.b{animation:fl 9s ease-in-out 1s infinite alternate-reverse}
.w1{animation:wv 9s ease-in-out infinite alternate}.w2{animation:wv 6s ease-in-out infinite alternate-reverse}
@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes fl{from{transform:translate(0,0)}to{transform:translate(40px,18px)}}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-70px)}}
</style>
